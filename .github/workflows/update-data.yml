name: Update player data

# Git-scraping: fetch on a schedule, commit the JSON back to the repo.
on:
  schedule:
    - cron: "17 9 * * 1"      # weekly, Mondays 09:17 UTC (MLS plays weekends)
  workflow_dispatch: {}         # allow manual runs from the Actions tab

permissions:
  contents: write               # needed to commit the refreshed data

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch ASA (MLS advanced stats)
        working-directory: scripts
        run: python fetch_asa.py

      - name: Fetch Transfermarkt (roster)
        working-directory: scripts
        continue-on-error: true          # scrape may be blocked; don't fail the whole run
        run: python fetch_transfermarkt.py

      - name: Fetch FBref (career context)
        working-directory: scripts
        continue-on-error: true
        run: python fetch_fbref.py

      - name: Build unified dataset
        working-directory: scripts
        run: python build_players.py

      - name: Commit refreshed data
        run: |
          git config user.name  "beyondcltfc-bot"
          git config user.email "actions@github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes."
          else
            git commit -m "data: refresh $(date -u +'%Y-%m-%d')"
            git push
          fi
