name: Update player data

# Git-scraping: fetch from every source on a schedule, aggregate, commit the JSON
# back to the repo. ASA + Wikipedia + build are required; every other source is a
# best-effort cross-check (continue-on-error) so one flaky source never blocks a
# refresh. build_players.py merges whatever raw files are present.
on:
  schedule:
    - cron: "17 9 * * 1"      # weekly, Mondays 09:17 UTC (MLS plays weekends)
  workflow_dispatch: {}         # allow manual runs from the Actions tab

permissions:
  contents: write               # needed to commit the refreshed data

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      # API-FOOTBALL is skipped automatically when this secret is unset.
      APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
      # Self-hosted Transfermarkt API (sidecar started below).
      TRANSFERMARKT_API: http://localhost:8000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      # --- Required spine -------------------------------------------------------
      - name: Fetch ASA (MLS per-season stats)
        working-directory: scripts
        run: python fetch_asa.py

      - name: Fetch Wikipedia (cross-league career context)
        working-directory: scripts
        run: python fetch_wikipedia.py

      # --- Transfermarkt: primary cross-league career source (self-hosted API) --
      # NOTE: verify the image name against felipeall/transfermarkt-api before relying on it.
      - name: Start Transfermarkt API sidecar
        continue-on-error: true
        run: |
          docker run -d --name tmkt -p 8000:8000 felipeall/transfermarkt-api:latest
          for i in $(seq 1 20); do
            curl -sf http://localhost:8000/ >/dev/null && break || sleep 3
          done

      - name: Fetch Transfermarkt
        working-directory: scripts
        continue-on-error: true
        run: python fetch_transfermarkt.py

      # --- Best-effort cross-checks --------------------------------------------
      - name: Fetch FBref (extra career context, best-effort)
        working-directory: scripts
        continue-on-error: true          # Cloudflare frequently 403s CI runners
        run: python fetch_fbref.py

      - name: Fetch Wikidata (bio + club timelines)
        working-directory: scripts
        continue-on-error: true
        run: python fetch_wikidata.py

      - name: Fetch TheSportsDB (bio, former teams, honours)
        working-directory: scripts
        continue-on-error: true
        run: python fetch_thesportsdb.py

      - name: Fetch API-FOOTBALL (sanctioned MLS/Liga MX backstop)
        working-directory: scripts
        continue-on-error: true
        run: python fetch_apifootball.py

      # --- worldfootballR (R): independent FBref + Transfermarkt cross-read ------
      - uses: r-lib/actions/setup-r@v2
        continue-on-error: true
        with:
          r-version: "release"

      - name: Install worldfootballR
        continue-on-error: true
        run: Rscript -e 'install.packages(c("worldfootballR","jsonlite"), repos="https://cloud.r-project.org")'

      - name: Fetch worldfootballR cross-read
        working-directory: scripts
        continue-on-error: true
        run: python fetch_worldfootball.py

      # --- Aggregate + commit ---------------------------------------------------
      - name: Build unified dataset
        working-directory: scripts
        run: python build_players.py

      - name: Stop Transfermarkt API sidecar
        if: always()
        continue-on-error: true
        run: docker rm -f tmkt

      - name: Commit refreshed data
        run: |
          git config user.name  "beyondcltfc-bot"
          git config user.email "actions@github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes."
          else
            git commit -m "data: refresh $(date -u +'%Y-%m-%d')"
            git push
          fi
